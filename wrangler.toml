name = "assignment-notebook"
main = "src/worker.js"
compatibility_date = "2025-10-01"
routes = [{ pattern = "asigment.yakton.net", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Storage for accounts + homework. Wrangler creates this KV namespace for you on first deploy.
[[kv_namespaces]]
binding = "DB"
